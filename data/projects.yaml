# 语音开源雷达 · 结构化项目登记表
# 维护规则：
#   1. 每条必须包含 repo / category / license / one_liner
#   2. verified 为"最后核实日期"，未核实的字段写 unknown，不要猜
#   3. 权重许可与代码许可分开记（weights_license），两者常常不同
#   4. 新增条目同时更新对应 docs/*.md

meta:
  version: "0.1.0"
  updated_at: "2026-10-27"
  maintainer: xiaopengs
  scope: "语音方向开源项目：ASR / TTS / 全双工 / Agent 编排 / 说话人 / 端侧 / 音频前端 / 变声 / 翻译 / 会议应用"

